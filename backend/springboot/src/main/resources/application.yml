spring:
  application:
    name: face-recognition-backend
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  
  # RabbitMQ
  rabbitmq:
    host: localhost
    port: 5888
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 1
        max-concurrency: 5
        # Allow messages up to 50MB. The default limit is much smaller.
        max-receive-size: 52428800

  # MinIO object storage
  minio:
    endpoint: http://localhost:30000
    accessKey: minioadmin
    secretKey: minioadmin
    bucketName: faces
    placesBucketName: places
    peopleBucketName: people

  # Milvus vector database
  milvus:
    host: localhost
    port: 19530
    collectionName: face_embeddings
    peopleCollectionName: people_embeddings
    alertCollectionName: alert_embeddings
    searchThreshold: 0.65
    peopleMatchThreshold: 0.80
    alertMatchThreshold: 0.85
  datasource:
    url: jdbc:mysql://localhost:3306/face_recognition?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: face
    password: face
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.face.recognition: DEBUG
  charset:
    console: UTF-8

jwt:
  secret: 9a4f4e1ed0fd4db8a679e9a4f4e1ed0fd4db8a679e9a4f4e1ed0fd4db8a679e
  expiration: 86400000 # 24 hours
