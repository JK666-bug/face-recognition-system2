
services:
  # ---------------------------------------------------------
  # 1. RabbitMQ
  # ---------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5888:5672"   # client port, moved to 5888 to avoid a reserved Windows range
      - "15672:15672" # management console (guest/guest)
    restart: always

  # ---------------------------------------------------------
  # 2. MinIO object storage, shared by the app and Milvus
  # ---------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: minio
    ports:
      - "30000:9000" # API port
      - "30001:9001" # console port
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always

  # ---------------------------------------------------------
  # 3. Milvus dependency: etcd
  # ---------------------------------------------------------
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.0
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION_RENDER_BY_HOUR=1
      - ETCD_AUTO_COMPACTION_RETENTION=1
    command: etcd -advertise-client-urls http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: always

  # ---------------------------------------------------------
  # 4. Milvus standalone
  # ---------------------------------------------------------
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530" # Milvus API port
    depends_on:
      - "etcd"
      - "minio"
    restart: always
    
  # ---------------------------------------------------------
  # 5. Attu, the Milvus web console
  # ---------------------------------------------------------
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.3.0
    environment:
      MILVUS_URL: milvus-standalone:19530
    ports:
      - "5000:3000"
    depends_on:
      - "standalone"
    restart: always

  # ---------------------------------------------------------
  # 6. MySQL for accounts and other relational metadata
  # ---------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: face_recognition
      MYSQL_USER: face
      MYSQL_PASSWORD: face
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  minio_data:
  etcd_data:
  milvus_data:
  mysql_data:
