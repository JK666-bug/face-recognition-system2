
services:
  # ---------------------------------------------------------
  # 1. RabbitMQ - 消息队列
  # ---------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5888:5672"   # 程序连接端口 (由 5678 修改为 5888，避开 Windows 排除范围)
      - "15672:15672" # 管理界面端口 (guest/guest)
    restart: always

  # ---------------------------------------------------------
  # 2. MinIO - 对象存储 (同时供业务和 Milvus 使用)
  # ---------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: minio
    ports:
      - "30000:9000" # API 端口 (由 10000 修改为 30000)
      - "30001:9001" # 控制台界面端口 (由 10001 修改为 30001)
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always

  # ---------------------------------------------------------
  # 3. Milvus - 向量数据库组件 (Etcd)
  # ---------------------------------------------------------
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.0
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION_RENDER_BY_HOUR=1
      - ETCD_AUTO_COMPACTION_RETENTION=1
    command: etcd -advertise-client-urls http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: always

  # ---------------------------------------------------------
  # 4. Milvus Standalone - 向量数据库
  # ---------------------------------------------------------
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530" # Milvus API 端口
    depends_on:
      - "etcd"
      - "minio"
    restart: always
    
  # ---------------------------------------------------------
  # 5. Attu - Milvus 可视化管理界面
  # ---------------------------------------------------------
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.3.0
    environment:
      MILVUS_URL: milvus-standalone:19530
    ports:
      - "3000:3000"
    depends_on:
      - "standalone"
    restart: always

volumes:
  minio_data:
  etcd_data:
  milvus_data:
